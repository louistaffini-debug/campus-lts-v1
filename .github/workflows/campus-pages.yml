name: Campus LTS Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'apps-script/CampusV1.gs', 'scripts/test-campus.mjs', '.github/workflows/campus-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campus-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-campus.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4

